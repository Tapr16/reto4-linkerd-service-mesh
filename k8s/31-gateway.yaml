# Punto de entrada desde el PC: nginx mallado que reenvía todo a "web".
# La petición sale por el linkerd-proxy de este pod, que aplica el HTTPRoute.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: reto4
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        proxy_pass http://web.reto4.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host web.reto4.svc.cluster.local;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: reto4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: reto4
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
